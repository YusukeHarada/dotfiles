name: Protect main from OS-specific branches

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge from OS-specific branches
        run: |
          blocked="wsl2-ubuntu windows11"
          for branch in $blocked; do
            if [ "${{ github.head_ref }}" = "$branch" ]; then
              echo "::error::${branch} ブランチは main にマージできません。このブランチは OS 専用の独立ブランチです。"
              exit 1
            fi
          done
